
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>User Dashboard - AgriRent Hub</title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <!-- COMMON CSS -->
    <link
        rel="stylesheet"
        href="../css/common.css"
    >

    <!-- USER DASHBOARD CSS -->
    <link
        rel="stylesheet"
        href="../css/user-dashboard.css"
    >
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">

        <div class="nav-left">
            AgriRent Hub
        </div>

        <div class="nav-right">

            <!-- DASHBOARD -->
            <a href="dashboard.html">
                Dashboard
            </a>

            <!-- MY BOOKINGS -->
            <a href="user-bookings.html">
                My Bookings
            </a>

            <!-- NOTIFICATION BELL -->
            <div class="notification-wrapper">

                <button
                    id="notificationBell"
                    class="notification-bell"
                    onclick="toggleNotifications()"
                    title="Notifications"
                >
                    🔔

                    <span
                        id="notificationBadge"
                        class="notification-badge"
                        style="display:none;"
                    >
                        0
                    </span>
                </button>

                <!-- NOTIFICATION DROPDOWN -->
                <div
                    id="notificationPanel"
                    class="notification-panel"
                >

                    <div class="notification-header">

                        <h3>
                            Notifications
                        </h3>

                        <button
                            onclick="markAllNotificationsRead()"
                            class="mark-all-btn"
                        >
                            Mark all as read
                        </button>

                    </div>

                    <div id="notificationList">

                        <p class="no-notifications">
                            No notifications
                        </p>

                    </div>

                </div>

            </div>

            <!-- LOGOUT -->
            <a
                href="login.html"
                onclick="logout()"
            >
                Logout
            </a>

        </div>

    </nav>

    <!-- MAIN CONTENT -->
    <main class="container">

        <!-- AVAILABLE EQUIPMENT -->
        <h2 class="title">
            Available Equipment
        </h2>

        <div class="table-wrapper">

            <p
                id="noDataMsg"
                class="no-data-msg"
                style="display:none;"
            >
                No equipment available right now.
                Please check later.
            </p>

            <table class="equipment-table">

                <thead>
                    <tr>
                        <th>Image</th>
                        <th>Name</th>
                        <th>Description</th>
                        <th>Price / Day</th>
                        <th>Available Qty</th>
                        <th>Vendor Name</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="equipmentBody">
                    <!-- Rows loaded by JavaScript -->
                </tbody>

            </table>

        </div>

    </main>

    <!-- COMMON JAVASCRIPT -->
    <script src="../js/common.js"></script>

    <!-- USER DASHBOARD JAVASCRIPT -->
    <script src="../js/user-dashboard.js"></script>

</body>

</html>
